<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment frame</title>
<!--
  Stands in for a Stripe/Razorpay-style payment iframe. Same-origin, so a
  content script COULD reach it if the extension injected into all frames.
  The card number here is a Luhn-valid test vector and is painted into the
  top-level screenshot regardless of whether any script runs in this frame —
  which is exactly why it must be detected.
-->
<style>
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       color:#15181d;background:#fff;padding:12px 14px}
  label{display:block;font-size:12.5px;font-weight:600;margin:0 0 4px}
  input{width:100%;padding:8px 10px;border:1px solid #e3e6ea;border-radius:8px;font:inherit;
        box-sizing:border-box;margin-bottom:10px}
  .saved{font-size:12.5px;color:#5b6472}
  .val{font-variant-numeric:tabular-nums;color:#15181d}
</style>
</head>
<body>
  <label for="if-card">Card Number</label>
  <input id="if-card" name="cardNumber" type="text" inputmode="numeric" autocomplete="cc-number">
  <label for="if-cvv">CVV</label>
  <input id="if-cvv" name="cvv" type="password" autocomplete="cc-csc">
  <p class="saved">Saved card: <span class="val">4111 1111 1111 1111</span></p>
</body>
</html>
